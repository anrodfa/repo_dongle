# Configuracion comun del Corne para la mitad izquierda.
# Se mantiene separada para permitir opciones exclusivas en la mitad derecha.
CONFIG_ZMK_KEYBOARD_NAME="Arf_Corne"

# Sin underglow: la tira de LEDs esta desoldada.

# Con dongle la izquierda pasa a ser periferica. El shield corne_left de ZMK
# pone ZMK_SPLIT_ROLE_CENTRAL=y en su Kconfig.defconfig, que es solo un valor
# por defecto, asi que se anula desde aqui. Sin esta linea habria dos centrales
# peleandose y las mitades no se conectarian al dongle.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Se mantiene aunque la izquierda ya no genere HID de raton: el keymap usa &mkp
# y las perifericas tambien compilan el keymap, asi que el behavior tiene que
# existir aqui o no compila.
CONFIG_ZMK_POINTING=y
# Solo con el snippet zmk-usb-logging (sin el, CONFIG_LOG esta apagado):
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

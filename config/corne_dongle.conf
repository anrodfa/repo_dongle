# Configuracion del dongle (central del split, conectado por USB).
CONFIG_ZMK_KEYBOARD_NAME="Arf_Corne"

# El dongle es quien emite el HID del puntero a partir de lo que le reenvia la
# derecha, y quien ejecuta los &mkp del keymap.
CONFIG_ZMK_POINTING=y

# El keymap usa &rgb_ug en varios sitios. El behavior de underglow tiene
# locality GLOBAL: se ejecuta en la central y se reenvia a las dos perifericas,
# que son las que tienen LEDs de verdad. Por eso tiene que estar compilado aqui
# aunque el dongle no lleve tira: el overlay de placa declara el controlador en
# spi1 y no pasa nada porque no haya nada enchufado.
CONFIG_ZMK_RGB_UNDERGLOW=y
# EXT_POWER apagado A PROPOSITO en el dongle: el pin VCC de la nice!nano lo
# conmuta P0.13, y la pantalla se alimenta de ahi. Con =y, un RGB_TOG (que se
# ejecuta tambien aqui) cortaria VCC y apagaria la pantalla. Las mitades tienen
# su propio .conf y siguen cortando la tira al apagar el underglow.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=2

# Vive enchufado al USB: no tiene ningun sentido que entre en deep sleep, y si
# lo hiciera dejaria a las mitades sin central.
CONFIG_ZMK_SLEEP=n

CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# --- Pantalla Prospector (shield prospector_adapter) ------------------------

# Brillo segun el sensor de luz APDS9960 (overlay de placa, i2c0; la linea INT
# de D14 no se usa) con nuestro hilo, src/display_als_backlight.c, no con el
# del modulo: ese no apaga la pantalla en reposo y espera lecturas de 0 a 100.
# Por eso el sensor del modulo se queda a n. El sensor se lee a mano por I2C,
# sin el driver de Zephyr, porque el montado es un clon con ID 0x9E. FIXED_BRIGHTNESS es el brillo de arranque y el que
# queda si el sensor no responde.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
CONFIG_DONGLE_ALS=y

# Calibracion: con SHOW_READING sale arriba a la derecha "luz <lectura> <brillo>%".
# Apuntar la lectura a oscuras / con la luz de siempre / con luz fuerte y poner
# MIN_READING (por debajo, brillo minimo) y MAX_READING (por encima, maximo).
# Entre medias el brillo sube en escala logaritmica. Despues quitar SHOW_READING.
CONFIG_DONGLE_ALS_SHOW_READING=y
CONFIG_DONGLE_ALS_MIN_READING=5
CONFIG_DONGLE_ALS_MAX_READING=2000
CONFIG_DONGLE_ALS_MIN_BRIGHTNESS=5
CONFIG_DONGLE_ALS_MAX_BRIGHTNESS=100

# Teclas modificadoras con nombres de Windows (Win/Alt/Ctrl/Shift) en vez de Mac.
CONFIG_PROSPECTOR_MODIFIER_OS_WINDOWS=y

# Riesgo de "region 'RAM' overflowed": el README del modulo dice bajar el
# buffer de LVGL de 50 a 25. Este dongle va mas cargado que el caso tipico
# (BT_MAX_CONN=7, underglow, logging USB), asi que se baja de entrada.
CONFIG_LV_Z_VDB_SIZE=25

# La pantalla se apaga (backlight a 0) al pasar ZMK a inactivo y se enciende con
# la siguiente tecla o movimiento del trackball: src/display_als_backlight.c
# (o display_idle_backlight.c si se quita DONGLE_ALS).
# El tiempo es el idle de ZMK, 30 s por defecto. Para cambiarlo (solo afecta al
# dongle), descomentar y poner los milisegundos:
# CONFIG_ZMK_IDLE_TIMEOUT=30000
